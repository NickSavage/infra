version: '3.8'

services:
  mc:
    image: itzg/minecraft-server
    container_name: minecraft-server-creative
    ports:
      - "25566:25565"
    environment:
      EULA: "TRUE" # Accept Minecraft's EULA
      MODE: "creative"
      VERSION: "1.21.5"
    volumes:
      - ./data:/data # Bind the data directory to the container's /data path
    restart: unless-stopped


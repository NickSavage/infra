# Telegraf metric agent — one per node.
#
# Source of truth: nick/infra, telegraf/  (this file is copied to each host by
# deploy-telegraf.sh, together with conf/<node>.conf → telegraf.conf).
#
# Runs the STOCK upstream image. It used to build locally (Dockerfile) only to add the
# Ookla speedtest CLI, which no config has called since 2026-10-22 — so the build is gone
# and the tag is pinned instead. Bump it deliberately, then deploy EVERY node:
#   bash telegraf/deploy-telegraf.sh nas-1   (nas-2, server-1, server-3, eos --local too)
services:
  telegraf:
    image: telegraf:1.35.2
    container_name: telegraf
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc

# Authelia - forward-auth SSO gateway for non-OIDC apps (Sonarr, Radarr, etc.)
# Complementary to Pocket ID (id.thesavages.ca), which handles OIDC-native apps.
services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Toronto
    volumes:
      - ./config:/config
    ports:
      - "9091:9091"
    networks:
      - default
    healthcheck:
      # Image ships wget (no curl); hit the JSON health endpoint.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9091/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    name: authelia_default

# OAuth2 Proxy -> Pocket ID (OIDC). Replaces Authelia as the forward-auth layer.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    restart: unless-stopped
    command: ["--config", "/etc/oauth2-proxy/oauth2-proxy.cfg"]
    env_file: .env
    environment:
      TZ: America/Toronto
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    # Pin id.thesavages.ca to the docker host so the container reaches Pocket ID
    # via NPM without depending on NAT hairpin/reflection:
    extra_hosts:
      - "id.thesavages.ca:192.168.0.6"
    ports:
      - "4180:4180"
    networks:
      - default

networks:
  default:
    name: oauth2-proxy_default

# openmw-web — self-hosted Morrowind-in-the-browser server (OpenMW compiled to WebAssembly).
# Upstream: https://github.com/Virtastic/openmw-web — GPL-3.0-or-later. Server image is pulled
# prebuilt from GHCR; nothing is compiled here.
#
# DEVIATIONS FROM UPSTREAM docker-compose.yml (deliberate, this fleet):
#   1. Caddy is kept (it owns the app's serving contract: COOP/COEP cross-origin isolation,
#      application/wasm, brotli precompressed siblings, Range), but it is published on
#      192.168.0.93:8090 -> :80 ONLY. Host :80/:443 are not touched and no certificate is
#      requested here: TLS + the hostname come from Nginx Proxy Manager on 192.168.0.6
#      (proxy host: openmw.thesavages.ca -> http://192.168.0.93:8090).
#      In the setup wizard answer the hosting question as LAN / behind your own proxy
#      (ProxySettings.internal) so Caddy stays plain-HTTP and never tries ACME.
#      HTTPS at the edge is REQUIRED for this app: the engine needs a secure context for
#      SharedArrayBuffer/memory64, so http://<lan-ip> can never run the game (only localhost).
#   2. No `updater` container (upstream's dashboard-update agent needs a git checkout of the
#      repo plus /var/run/docker.sock). This dir is not a git checkout. To update:
#        set OPENMW_WEB_TAG in .env, then: docker compose pull && docker compose up -d
#      The game CLIENT update button in the dashboard still works on its own.
#   3. server REPO_DIR is written explicitly in .env (absolute host path) instead of being
#      produced by upstream's setup.sh.
services:
  openmw-web:
    image: ghcr.io/virtastic/openmw-web-server:${OPENMW_WEB_TAG:-latest}
    container_name: openmw-web
    # Picks single-player vs multiplayer from <data>/.mode, written by the setup wizard.
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: []
    # The dashboard's Restart button works by the server exiting cleanly on SIGTERM.
    restart: unless-stopped
    init: true
    # A gateway waits for worlds to drain on shutdown; Docker's default 10s would SIGKILL it.
    stop_grace_period: 30s
    volumes:
      - ${REPO_DIR:-.}/data:/data          # accounts, saves, settings, logs, caddy config
      - ${REPO_DIR:-.}/gamedata:/data/gamedata  # YOUR Morrowind files (dashboard upload or copy)
      - ${REPO_DIR:-.}/play:/client        # served game client (release zip), writable for updates
    environment:
      - NODE_ENV=production
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      # 1 restores the demo/data-picker chooser at /. Off by default.
      - OMW_ENABLE_LAUNCHER=${OMW_ENABLE_LAUNCHER:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: openmw-web-caddy
    restart: unless-stopped
    depends_on:
      - openmw-web
    ports:
      # LAN-IP only (not 0.0.0.0) — NPM on .6 is the only intended consumer.
      - "192.168.0.93:8090:80"
    # --watch reloads when the config changes, which is how the dashboard applies a hosting
    # change by itself. The config is GENERATED by the server (data/caddy/Caddyfile).
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--watch"]
    volumes:
      - ${REPO_DIR:-.}/data/caddy:/etc/caddy:ro
      - ${REPO_DIR:-.}/play:/srv/client:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:

services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: hawser
    restart: unless-stopped
    ports:
      - "2376:2376"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hawser_stacks:/data/stacks
    environment:
      - PORT=2376
      - TOKEN=${HAWSER_TOKEN}
    labels:
      - dockhand.update=false

volumes:
  hawser_stacks:

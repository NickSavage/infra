services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: hawser
    restart: unless-stopped
    ports:
      - "2376:2376"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hawser_stacks:/data/stacks
    environment:
      - PORT=2376
      - TOKEN=${HAWSER_TOKEN}
    # Upstream's healthcheck runs the image's shell/wget. Every non-Go binary in this image is
    # built for x86-64-v2, so on .160 (AMD Phenom II X6 1055T, no AVX) the check SIGILLs
    # (exit 132) and that host would sit permanently "unhealthy" even though the agent is fine.
    # Disabled uniformly; the real health signal is Dockhand's environment test
    # (POST /api/environments/<id>/test) plus the agent's own auto-reconnect.
    healthcheck:
      disable: true
    labels:
      - dockhand.update=false

volumes:
  hawser_stacks:

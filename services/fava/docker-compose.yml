services:
  fava:
    build: .
    image: nsavage/fava:latest
    container_name: fava
    restart: unless-stopped
    command: ["fava", "--host", "0.0.0.0", "--port", "5000",
              "/beancount/corp.bean", "/beancount/personal.bean"]
    expose:
      - "5000"
    ports:
      - "5090:5000"   # TEMP: keep direct access until Pocket-ID verifies; then remove
    networks:
      - fava-net
    volumes:
      - ./beancount:/beancount:ro

  # Pocket-ID SSO front for Fava (oauth2-proxy). Published on :5091.
  # During the Pocket-ID setup window both Fava (:5090) and this proxy are up;
  # once SSO is verified, remove the fava host-port publish to enforce it.
  fava-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: fava-proxy
    restart: unless-stopped
    depends_on:
      - fava
    ports:
      - "5091:4180"
    networks:
      - fava-net
    env_file: .env.proxy   # NOT `.env` (compose reserves that for interpolation
                           # and it leaked host creds into the container). `.env.*`
                           # is gitignored so this stays out of the infra repo.

networks:
  fava-net:
services:
  docker-in-docker:
    image: docker:dind
    container_name: forgejo-runner-dind
    privileged: true
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false', '--registry-mirror=http://192.168.0.160:5000', '--insecure-registry=192.168.0.160:5000']
    restart: unless-stopped
    volumes:
      - ./dind-data:/var/lib/docker

  runner:
    image: data.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    depends_on:
      docker-in-docker:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    user: 1001:1001
    volumes:
      - ./data:/data
    restart: unless-stopped
    command: forgejo-runner daemon --config /data/runner-config.yml

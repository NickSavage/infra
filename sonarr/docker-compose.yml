services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - ./config:/config
      - /mnt/nas-data-4/tv:/tv #optional
      - /mnt/nas-data-4/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

